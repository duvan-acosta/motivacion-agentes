services:
  motivacion-agentes:
    build: .
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - PUBLICATION_QUEUE_DIR=/app/publication_queue
    volumes:
      - ./publication_queue:/app/publication_queue
      - ./data/chroma:/app/data/chroma
      - ./data/sessions:/app/data/sessions
      - ./data/screenshots:/app/data/screenshots
      - ./tmp:/app/tmp
      - ./wallpapers:/app/wallpapers
      - ./.env:/app/.env:ro
    working_dir: /app
    shm_size: "256mb"

  # Ejemplo: generación demo sin APIs
  generate-demo:
    build: .
    env_file:
      - .env
    environment:
      - DEMO_MODE=true
      - MOCK_MODE=true
      - PYTHONPATH=/app
    volumes:
      - ./publication_queue:/app/publication_queue
      - ./data/chroma:/app/data/chroma
      - ./tmp:/app/tmp
      - ./wallpapers:/app/wallpapers
    command: ["generate", "--demo"]

  # Panel web de administración
  web:
    build: .
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - PUBLICATION_QUEUE_DIR=/app/publication_queue
    volumes:
      - ./publication_queue:/app/publication_queue
      - ./data/chroma:/app/data/chroma
      - ./data/analytics:/app/data/analytics
      - ./tmp:/app/tmp
      # .env montado RW para que el panel pueda guardar las API keys.
      # En los demás servicios sigue siendo :ro porque no escriben.
      - ./.env:/app/.env
    ports:
      - "8080:8080"
    entrypoint: []
    command: ["python", "-m", "uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8080"]
    # Sin restart policy: deja que preview_start gestione el lifecycle. Para prod,
    # usar `docker compose run` o un compose.prod.yml que sí incluya restart.

  # Scheduler en background (generación + publicación diaria)
  scheduler:
    build: .
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./publication_queue:/app/publication_queue
      - ./data/chroma:/app/data/chroma
      - ./data/sessions:/app/data/sessions
      - ./data/screenshots:/app/data/screenshots
      - ./tmp:/app/tmp
      - ./wallpapers:/app/wallpapers
      - ./.env:/app/.env:ro
    command: ["schedule"]
    restart: unless-stopped
    # Necesario para Playwright/Chromium dentro del contenedor
    shm_size: "256mb"
