brand:
  name: "Mental Equilibrio"
  display_name: "Mental Equilibrio"  # usado en pie de marca de imágenes/videos
  tagline: "Equilibrio mental para la vida diaria"
  email: "mentalequilibrio18@gmail.com"

  # Handles reales por plataforma. Los handles difieren entre redes porque
  # `mentalequilibrio` limpio no estaba disponible en todas. El sistema usa
  # estos para construir URLs canónicas y para CTAs de cuenta cruzada.
  handles:
    instagram: "@mentalequilibrio18"
    tiktok: "@mentalequilibrio8"
    youtube: "EquilibrioMental91"
    twitter: "@MentalEqui"
    facebook: "mentalequilibrio18"
  language: es
  tone:
    - directo
    - cálido
    - esperanzador
  avoid:
    - frases nuevas-eras (vibras, manifestar, ley de atracción)
    - toxic positivity ("solo piensa positivo")
    - culpabilizar al lector
    - sermón académico / filosofía críptica

content:
  posts_per_day: 6       # 3 TikTok + 2 Instagram + 1 Facebook
  reels_per_day: 2
  # Temas ordenados por potencial viral — los primeros tienen mayor save rate
  themes_rotation:
    - ansiedad_cotidiana   # #1 save rate en LATAM (tema universal)
    - amor_propio          # #2 share rate — mandan a amigos
    - empezar_de_nuevo     # #3 save rate — momentos de crisis
    - resiliencia          # alto engagement lunes y miércoles
    - calma                # viernes y fines de semana
    - esperanza            # domingos y lunes (inicio de semana)
    - autoestima           # miércoles — midweek dip
    - propósito            # jueves y domingos
    - coraje               # lunes y jueves
    - gratitud             # viernes — balance semanal
    - soledad_saludable    # sábados — mayor introspección
    - limites              # martes y jueves

monetization:
  # Umbrales de monetización por plataforma
  thresholds:
    tiktok_creator_fund: 10000      # seguidores
    tiktok_live_gifts: 1000         # seguidores
    instagram_reels_bonus: 1000     # seguidores (con invite)
    facebook_instream_ads: 10000    # seguidores + 600k min vistos/60 días

  # CTAs de crecimiento (rotación para no saturar)
  growth_ctas:
    save: "Guarda esto para cuando lo necesites."
    comment: "¿Qué te cuesta más soltar? Cuéntame abajo."
    share: "Mándaselo a alguien que necesite leer esto hoy."
    follow: "Sígueme para más contenido como este."

  # Afiliados futuros (cuando lleguemos a umbral)
  affiliate_niches:
    - libros de psicología popular (LATAM Amazon)
    - apps de meditación y bienestar
    - cursos online de desarrollo personal
    - productos de bienestar físico-mental

# Hashtags base alineados con motivación masiva latina (no "filosofía").
hashtags_base:
  - "#motivacion"
  - "#amorpropio"
  - "#saludmental"
  - "#frasesmotivadoras"
  - "#superacion"
  - "#autoestima"
  - "#crecimientopersonal"
  - "#pazinterior"
  - "#bienestar"
  - "#mentalidad"

visual:
  font_family: "Vollkorn"       # serif moderna alemana, cálida, no tradicional
  fallback_font: "DejaVu Serif"
  text_color: "#FAF3E7"         # blanco crema cálido, no puro
  gradient_opacity: 0.55
  max_message_lines: 6

video:
  min_duration_seconds: 20
  max_duration_seconds: 40
  fps: 30
  background_music_volume: 0.08
