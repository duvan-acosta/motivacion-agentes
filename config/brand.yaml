brand:
  name: "Mental Equilibrio"
  display_name: "Mental Equilibrio"  # usado en pie de marca de imágenes/videos
  tagline: "Equilibrio mental para la vida diaria"
  email: "mentalequilibrio18@gmail.com"

  # Handles reales por plataforma. Los handles difieren entre redes porque
  # `mentalequilibrio` limpio no estaba disponible en todas. El sistema usa
  # estos para construir URLs canónicas y para CTAs de cuenta cruzada.
  handles:
    instagram: "@mentalequilibrio18"
    tiktok: "@mentalequilibrio91"
    youtube: "EquilibrioMental91"        # nombre del canal (no es @)
    twitter: "@MentalEquilibri"          # 15 chars máx por límite de X
    facebook: "mentalequilibrio18"       # página de Facebook
  language: es
  tone:
    - directo
    - cálido
    - esperanzador
  avoid:
    - frases nuevas-eras (vibras, manifestar, ley de atracción)
    - toxic positivity ("solo piensa positivo")
    - culpabilizar al lector
    - sermón académico / filosofía críptica

content:
  posts_per_day: 1
  reels_per_day: 1
  # Temas ampliados: psicología práctica, no solo "estoicismo". El sistema
  # rota equitativamente entre estos al lanzar batches grandes.
  themes_rotation:
    - esperanza
    - amor_propio
    - empezar_de_nuevo
    - ansiedad_cotidiana
    - autoestima
    - calma
    - resiliencia
    - propósito
    - gratitud
    - coraje
    - soledad_saludable
    - limites

# Hashtags base alineados con motivación masiva latina (no "filosofía").
hashtags_base:
  - "#motivacion"
  - "#amorpropio"
  - "#saludmental"
  - "#frasesmotivadoras"
  - "#superacion"
  - "#autoestima"
  - "#crecimientopersonal"
  - "#pazinterior"
  - "#bienestar"
  - "#mentalidad"

visual:
  font_family: "Vollkorn"       # serif moderna alemana, cálida, no tradicional
  fallback_font: "DejaVu Serif"
  text_color: "#FAF3E7"         # blanco crema cálido, no puro
  gradient_opacity: 0.55
  max_message_lines: 6

video:
  min_duration_seconds: 20
  max_duration_seconds: 40
  fps: 30
  background_music_volume: 0.08
