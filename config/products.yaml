# Catálogo de productos monetizables que el ContentCreatorAgent puede cerrar
# con un CTA, y que el PublisherAgent inserta en el caption con UTM.
#
# Estructura:
#   - id: identificador único, sin espacios
#     name: nombre visible
#     short_name: nombre corto para CTAs ("el journal", "los wallpapers")
#     url: URL canónica del producto (link in bio / tienda)
#     description: una línea, para el LLM
#     price_usd: opcional
#     cta_style: short | full | question | invitation
#         short      → "Pack de wallpapers en mi tienda (link en bio)."
#         full       → frase desarrollada coherente con la marca
#         question   → cierre con pregunta + link
#         invitation → "Si quieres llevar esto contigo…"
#
# active_product_id: id del producto que el sistema promueve esta semana/mes.
# Si está vacío o no existe, no se inyecta CTA y el caption queda sin promoción.

products:
  - id: wallpapers_pack
    name: "30 Wallpapers Reflexivos"
    short_name: "los wallpapers"
    url: "https://stan.store/mentalequilibrio/p/wallpapers"
    description: "Pack de 30 fondos en 4K vertical con frases reflexivas para móvil."
    price_usd: 7
    cta_style: invitation

  - id: journal_30dias
    name: "Journal Digital — 30 días"
    short_name: "el journal"
    url: "https://stan.store/mentalequilibrio/p/journal"
    description: "PDF interactivo con una pregunta reflexiva por día durante 30 días."
    price_usd: 12
    cta_style: question

  - id: newsletter
    name: "Newsletter"
    short_name: "la newsletter"
    url: "https://mentalequilibrio.kit.com/suscribirse"
    description: "Una reflexión los domingos por la mañana, gratis."
    price_usd: 0
    cta_style: full

active_product_id: wallpapers_pack

# Tracking UTM por plataforma. Se inyecta automáticamente en la URL del CTA.
utm:
  medium: organic
  campaign: daily_post
  source_by_platform:
    instagram: ig
    facebook: fb
    tiktok: tt
    youtube: yt
    twitter: x
    pinterest: pin
